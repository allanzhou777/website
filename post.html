    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var postName = params.get('post');
        var content = document.getElementById('post-content');
        if (!postName) {
          content.innerHTML = '<p>No post specified.</p>';
          return;
        }
        fetch('posts/' + encodeURIComponent(postName) + '.md', { cache: 'no-store' })
          .then(function (r) {
            if (!r.ok) throw new Error('not found');
            return r.text();
          })
          .then(function (md) {
            content.innerHTML = marked.parse(md);
          })
          .catch(function () {
            content.innerHTML = '<p>Post not found.</p>';
          });
      })();
    </script>
